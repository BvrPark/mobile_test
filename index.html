<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>자기매매 신고 모바일 앱</title>
<style>
:root{--red:#E8231B;--red-d:#C81A13;--red-s:#FDECEB;--teal:#0A8CA3;--teal-s:#E7F4F6;--ink:#222;--sub:#6b6b6b;--mut:#999;--line:#e6e6e6;--soft:#f6f6f6;--green:#2F8F5B;--orange:#D97706;--blue:#2F6FD6;--blue-s:#EAF1FC}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#eceeef;font-family:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:var(--ink);letter-spacing:-.2px}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
.hide{display:none!important}
/* ---------- stage ---------- */
.stage{min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:32px 20px}
.phone{position:relative;width:393px;height:826px;flex:none;background:#fff;border-radius:55px;box-shadow:0 0 0 11px #1c1c1e,0 0 0 13px #3a3a3c,0 30px 60px rgba(0,0,0,.28);overflow:hidden}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:124px;height:36px;background:#000;border-radius:20px;z-index:90}
.sbar{position:absolute;top:0;left:0;right:0;height:54px;display:flex;justify-content:space-between;align-items:center;padding:6px 32px 0 42px;font-size:16px;font-weight:700;z-index:80;background:#fff}
.sbar .ic{display:flex;gap:6px;align-items:center}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#111;z-index:95}
.app{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column}
.ah{height:52px;flex:none;display:flex;align-items:center;padding:0 18px;border-bottom:1px solid var(--line);gap:10px;background:#fff}
.ah .logo{display:flex;align-items:baseline;gap:6px}
.ah .logo b{font-size:22px;font-weight:900;color:var(--red);letter-spacing:-1px}
.ah .logo span{font-size:14px;color:#444}
.ah h1{font-size:18px;margin:0;font-weight:700;flex:1;text-align:center}
.ah .back{width:32px;height:32px;border:0;background:none;font-size:26px;line-height:1;padding:0;color:#222}
.ah .sp{width:32px}
.ah .bell{margin-left:auto;border:0;background:none;font-size:13px;color:var(--sub);position:relative;padding:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
/* v2.1 상단 헤더 한 줄 표시 */
.ah .logo{white-space:nowrap;flex:none}.ah .logo b{font-size:20px}.ah .logo span{font-size:13px}
.ah h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet .sh h3{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rqtop{margin:12px 0 0}
.scr,.sheet{word-break:keep-all}
.scr{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 0 24px;scroll-behavior:smooth}
.scr::-webkit-scrollbar{width:0}
.tab{flex:none;height:84px;padding-bottom:30px;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:#fff}
.tab button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:#8a8a8a}
.tab button svg{width:24px;height:24px}
.tab button.on{color:var(--red);font-weight:700}
.tab button.plus .pc{width:34px;height:34px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;line-height:1;margin-top:-2px}
.tab button.plus.on .pc{background:var(--red-d)}
.tdot{position:absolute;top:6px;left:50%;margin-left:6px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;line-height:16px;font-weight:700}
.rq{border:1px solid var(--line);padding:14px;margin-top:12px;background:#fff;cursor:pointer}
.rq.todo{border-left:3px solid var(--red)}
.rq .h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rq .h b{font-size:15px}
.rq p{margin:6px 0 0;font-size:12.5px;color:#777}
.vc7{font-size:12.5px;line-height:1.7;color:#444;background:#fafafa;padding:10px 12px;margin-top:6px}
/* ---------- common ---------- */
.pad{padding:0 20px}
.sec{padding:22px 20px 6px}
.sec-t{display:flex;justify-content:space-between;align-items:flex-end;font-size:16px;font-weight:700;padding-bottom:10px;border-bottom:2px solid #333;margin:0 0 4px}
.sec-t small{font-size:12px;font-weight:400;color:var(--mut)}
.badge{display:inline-block;font-size:11px;line-height:1;padding:4px 6px;color:#fff;border-radius:2px;white-space:nowrap;font-weight:500;vertical-align:middle}
.b-teal{background:var(--teal)}.b-r{background:var(--red)}.b-g{background:var(--green)}.b-o{background:var(--orange)}.b-b{background:var(--blue)}.b-gray{background:#9a9a9a}.b-y{background:#B8860B}.b-lime{background:#5E9E12}.b-sky{background:#0EA5E9}.b-indigo{background:#5B4FD9}.b-purple{background:#9B51E0}.b-pink{background:#D9338A}.b-brown{background:#8D6E63}.b-crimson{background:#9F1239}.b-dark{background:#4B5563}
.b-line{background:#fff;color:#555;border:1px solid #ccc}
.big{font-size:23px;font-weight:700;line-height:1.38;letter-spacing:-.8px;margin:10px 0 6px}
.muted{color:var(--mut);font-size:13px;margin:0}
.link{color:var(--teal);font-weight:700;font-size:14px;background:none;border:0;padding:0}
.rows{list-style:none;margin:0;padding:0}
.rows li{display:flex;align-items:center;gap:10px;padding:15px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.rows li .t{flex:1;min-width:0}
.rows li p{margin:0 0 3px;font-size:12px;color:#888}
.rows li b{font-size:15px;font-weight:600}
.rows li:after{content:"›";font-size:26px;color:#c4c4c4;line-height:1}
.rows li.nochev:after{content:none}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;height:52px;width:100%;border:1px solid #999;background:#fff;font-size:16px;font-weight:600;border-radius:0}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.red:active{background:var(--red-d)}
.btn.sm{height:38px;font-size:14px;width:auto;padding:0 14px}
.btn.line-r{border-color:var(--red);color:var(--red)}
.btn:disabled{opacity:.4}
.btn2{display:grid;grid-template-columns:1fr 2fr;gap:8px}
.home-quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.home-quick .btn{width:100%;height:40px;min-height:40px;padding:0 8px;font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;white-space:nowrap}.home-quick .ico{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;margin-right:4px;font-size:11px;line-height:1}
.bottom-cta{position:sticky;bottom:0;background:#fff;padding:12px 20px 14px;border-top:1px solid var(--line);margin-top:16px;z-index:5}
.fld{margin:16px 0 0}
.fld>label,.fld .lb{display:block;font-size:13px;font-weight:700;color:#444;margin-bottom:7px}
.req:after{content:" *";color:var(--red)}
.inp{width:100%;height:48px;border:1px solid #cfcfcf;padding:0 12px;font-size:16px;background:#fff;border-radius:0}
.inp:focus,textarea:focus{outline:2px solid var(--teal);outline-offset:-1px;border-color:var(--teal)}
textarea.inp{height:auto;padding:10px 12px;resize:none}
.err{color:var(--red);font-size:12px;margin:6px 0 0;min-height:0}
.hint{color:var(--mut);font-size:12px;margin:6px 0 0;line-height:1.5}
.info{background:var(--teal-s);border-left:3px solid var(--teal);padding:11px 13px;font-size:12.5px;color:#245;line-height:1.6;margin:14px 0 0}
.warn{background:var(--red-s);border-left:3px solid var(--red);padding:11px 13px;font-size:12.5px;color:#7a1a14;line-height:1.6;margin:10px 0 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 14px;border:1px solid #ccc;background:#fff;font-size:13.5px;border-radius:17px;white-space:nowrap}
.chip.on{border-color:var(--ink);background:var(--ink);color:#fff;font-weight:600}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid #cfcfcf}
.seg button{height:46px;border:0;background:#fff;font-size:16px;font-weight:600;color:#888}
.seg button+button{border-left:1px solid #cfcfcf}
.seg button.buy.on{background:var(--red);color:#fff}
.seg button.sell.on{background:var(--blue);color:#fff}
.stepper{display:grid;grid-template-columns:48px 1fr 48px;border:1px solid #cfcfcf;height:48px}
.stepper button{border:0;background:var(--soft);font-size:22px;color:#444}
.stepper input{border:0;border-left:1px solid #e1e1e1;border-right:1px solid #e1e1e1;text-align:center;font-size:17px;font-weight:600;width:100%;min-width:0}
.stepper input:focus{outline:2px solid var(--teal);outline-offset:-2px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.picker{width:100%;height:48px;border:1px solid #cfcfcf;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:16px;text-align:left}
.picker .ph{color:#aaa}
.picker:after{content:"›";transform:rotate(90deg);color:#aaa;font-size:20px}
/* account card */
.acard{border:1px solid var(--line);padding:16px;margin-top:12px;display:flex;gap:12px;align-items:center;cursor:pointer;background:#fff}
.acard.sel{border:2px solid var(--red);padding:15px}
.acard.closed{opacity:.5}
.bk{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;flex:none}
.acard .t{flex:1;min-width:0}
.acard .t b{font-size:15px}
.acard .t p{margin:3px 0 0;font-size:13px;color:#777}
.ascroll{display:flex;gap:10px;overflow-x:auto;padding:4px 0 6px;scrollbar-width:none}
.ascroll::-webkit-scrollbar{display:none}
.amini{flex:none;width:178px;border:1px solid #d6d6d6;padding:12px;background:#fff;text-align:left;position:relative}
.amini.sel{border:2px solid var(--red);padding:11px}
.amini.sel:after{content:"✓";position:absolute;top:8px;right:10px;color:var(--red);font-weight:900}
.amini b{display:block;font-size:14px;margin:8px 0 2px}
.amini span{font-size:12px;color:#777}
.amini.add{display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--teal);font-weight:700;font-size:13px;border-style:dashed;width:110px}
/* evidence */
.evbox{border:1px dashed #bdbdbd;background:#fafafa;padding:16px;text-align:center}
.evbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.thumbs{display:flex;gap:10px;overflow-x:auto;padding:4px 0}
.thumb{flex:none;width:84px;height:150px;border:1px solid #ddd;position:relative;background:#f2f2f2 center/cover no-repeat;cursor:pointer}
.thumb .x{position:absolute;top:-1px;right:-1px;width:24px;height:24px;border:0;background:rgba(0,0,0,.7);color:#fff;font-size:14px}
.thumb .mk{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.65);color:#fff;font-size:11px;padding:4px 0;text-align:center}
.thumb.addth{display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px dashed #bbb;color:#888;font-size:12px;background:#fff}
/* trade row card */
.trow{border:1px solid #d9d9d9;margin-top:14px;padding:14px 14px 16px;position:relative;background:#fff}
.trow .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.trow .hd b{font-size:14px}
.trow .del{border:0;background:none;color:#888;font-size:13px;text-decoration:underline}
.qd{display:flex;gap:6px;margin-top:8px}
.qd button{height:30px;padding:0 10px;border:1px solid #d0d0d0;background:#fff;font-size:12.5px}
.qd button.on{border-color:var(--ink);font-weight:700}
.amt{font-size:12.5px;color:#666;margin-top:6px;text-align:right}
/* history */
.month{display:flex;align-items:center;justify-content:center;gap:18px;padding:14px 0 6px;font-size:17px;font-weight:700}
.month button{border:0;background:none;font-size:22px;color:#555;width:32px}
.month button:disabled{opacity:.25}
.summary{display:grid;grid-template-columns:repeat(3,1fr);border-top:2px solid #333;border-bottom:1px solid var(--line);margin:10px 0 0}
.summary div{padding:12px 6px;text-align:center;border-right:1px solid #eee}
.summary div:last-child{border:0}
.summary p{margin:0 0 4px;font-size:11.5px;color:#888}
.summary b{font-size:19px}
.dgrp{font-size:12.5px;color:#888;padding:16px 0 6px;font-weight:600}
.titem{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer}
.side{width:38px;height:38px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700}
.side.buy{background:var(--red-s);color:var(--red)}
.side.sell{background:var(--blue-s);color:var(--blue)}
.titem .t{flex:1;min-width:0}
.titem .t b{font-size:15px}
.titem .t p{margin:3px 0 0;font-size:12.5px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titem .r{text-align:right;font-size:12px;display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.clip{font-size:11.5px;color:var(--teal);font-weight:600}
.clip.no{color:var(--orange)}
.empty{padding:40px 10px;text-align:center;color:#999;font-size:14px;line-height:1.7}
/* hero */
.hero{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.kv{display:grid;grid-template-columns:96px 1fr;border-top:1px solid #333;font-size:14px;margin-top:6px}
.kv dt,.kv dd{margin:0;padding:11px 8px;border-bottom:1px solid #eee}
.kv dt{color:#666;background:#fafafa;font-weight:600;font-size:13px}
/* sheet */
.dim{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.dim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;z-index:70;max-height:86%;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .25s ease;border-radius:18px 18px 0 0;padding-bottom:30px}
.sheet.on{transform:none}
.sheet.full{top:0;max-height:none;border-radius:0}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:#d4d4d4;margin:8px auto 2px;flex:none}
.sheet .sh{display:flex;align-items:center;padding:10px 20px 12px;border-bottom:1px solid var(--line);flex:none}
.sheet .sh h3{margin:0;font-size:17px;flex:1}
.sheet .sh button{border:0;background:none;font-size:22px;color:#666;width:30px}
.sheet .sb{overflow-y:auto;padding:0 20px 10px;flex:1}
.sheet .sf{padding:10px 20px 0;flex:none}
.slist{list-style:none;margin:0;padding:0}
.slist li{display:flex;align-items:center;gap:10px;padding:14px 0;border-bottom:1px solid #eee;cursor:pointer}
.slist li .t{flex:1}
.slist li .t b{font-size:15px}
.slist li .t small{display:block;color:#999;font-size:12px;margin-top:2px}
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.bgrid button{border:1px solid #ddd;background:#fff;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12.5px}
.bgrid button.on{border:2px solid var(--red);padding:11px 3px;font-weight:700}
.bgrid .bk{width:34px;height:34px;font-size:13px}
.done{padding:50px 24px 20px;text-align:center}
.done .ok{width:72px;height:72px;border-radius:50%;background:var(--red-s);color:var(--red);font-size:38px;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-weight:900}
.done h2{font-size:22px;margin:0 0 8px;letter-spacing:-.6px}
.cbx{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.5;padding:12px 0}
.cbx input{width:20px;height:20px;flex:none;accent-color:var(--red);margin:1px 0 0}
/* mask editor */
.medit{position:absolute;inset:0;background:#111;z-index:85;display:flex;flex-direction:column;padding:0 0 30px}
.medit .mt{color:#fff;display:flex;align-items:center;padding:10px 16px;gap:10px}
.medit .mt b{flex:1;text-align:center;font-size:16px}
.medit .mt button{border:0;background:none;color:#fff;font-size:15px}
.medit .mt button.done{color:#ff6b63;font-weight:700}
.medit .cv{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:0 12px}
.medit canvas{max-width:100%;max-height:100%;touch-action:none;cursor:crosshair;background:#fff}
.medit .mg{color:#bbb;font-size:12.5px;text-align:center;padding:10px 20px;line-height:1.5}
.medit .mb{display:flex;justify-content:center;gap:10px;padding:0 16px}
.medit .mb button{height:40px;padding:0 16px;border:1px solid #555;background:#222;color:#eee;font-size:13.5px}
.viewer{position:absolute;inset:0;background:#000;z-index:88;display:flex;align-items:center;justify-content:center;padding:60px 10px 40px}
.viewer img{max-width:100%;max-height:100%}
.viewer button{position:absolute;top:60px;right:16px;border:0;background:rgba(255,255,255,.15);color:#fff;width:36px;height:36px;border-radius:50%;font-size:18px}
.toast{position:absolute;left:50%;bottom:104px;transform:translateX(-50%);background:rgba(20,20,20,.92);color:#fff;padding:11px 18px;font-size:13.5px;border-radius:22px;opacity:0;pointer-events:none;transition:.25s;z-index:99;width:max-content;max-width:330px;text-align:center}
.toast.on{opacity:1}
/* notes panel */
.notes{width:400px;max-width:100%;background:#fff;padding:26px 26px 30px;border-top:4px solid var(--red);font-size:13.5px;line-height:1.65;color:#333}
.notes h2{font-size:19px;margin:0 0 4px}
.notes h3{font-size:14.5px;margin:20px 0 6px;padding-bottom:6px;border-bottom:2px solid #333}
.notes ul{margin:0;padding-left:16px}
.notes li{margin:3px 0}
.notes .q{background:#fff6f5;border-left:3px solid var(--red);padding:8px 10px;margin:6px 0}
.notes .q b{color:var(--red)}
.notes .reset{margin-top:16px}
@media (max-width:900px){.notes{display:none}}
@media (max-width:500px){
 .stage{padding:0;display:block}
 .phone{width:100vw;height:100dvh;border-radius:0;box-shadow:none}
 .island,.homebar{display:none}
}
</style>
</head>
<body>
<div class="stage">
 <div class="phone" id="phone">


  <div class="app">
   <header class="ah" id="ah"></header>
   <main class="scr" id="scr"></main>
   <nav class="tab" id="tab" aria-label="하단 메뉴"></nav>
  </div>
  <div class="dim" id="dim"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true"></section>
  <div id="layer"></div>
  <div class="toast" id="toast" aria-live="polite"></div>
  <div class="homebar" aria-hidden="true"></div>
  <input type="file" id="fAlbum" accept="image/*" multiple class="hide">
  <input type="file" id="fCam" accept="image/*" capture="environment" class="hide">
 </div>


</div>

<script>
(function(){
/* =============== 데이터 =============== */
const TODAY='2026-10-23';
/* 통합 시스템 연계: 웹(준법감시 시스템)에서 로그인 대상자·적용 제한종목·사내 DB 거래를 전달받음 */
const BOOT=/*__BOOT__*/null;
const post=m=>{if(BOOT){try{parent.postMessage(Object.assign({src:'mb'},m),'*')}catch(e){}}};
const ME=BOOT?BOOT.me:{name:'김도현',co:'화재',type:'임원',pid:'A-1001'};
const BROKERS=[['가람증권','#E8231B'],['새솔투자증권','#0A8CA3'],['한결증권','#2F6FD6'],['바른투자증권','#2F8F5B'],['다온증권','#7A4FD0'],['미르증권','#D97706'],['누리증권','#C2185B'],['하늘투자증권','#00838F'],['기타','#8a8a8a']];

 <div class="fld"><span class="lb req">매매 구분</span><div class="seg"><button type="button" class="buy ${r.side==='매수'?'on':''}" data-act="side" data-i="${i}" data-v="매수">매수</button><button type="button" class="sell ${r.side==='매도'?'on':''}" data-act="side" data-i="${i}" data-v="매도">매도</button></div></div>
 <div class="fld"><span class="lb req">종목</span><button type="button" class="picker" data-act="pickStock" data-i="${i}">${r.code?`<span><b>${esc(SN[r.code])}</b> <span style="color:#999;font-size:13px">${r.code}</span></span>`:'<span class="ph">종목명 또는 코드 검색</span>'}</button>
 ${rs?`<div class="warn"><b>매매 제한종목입니다.</b> (${rs.from} ~ ${rs.to})<br>사실대로 등록해 주세요. 등록 후 준법감시부서에서 확인 요청이 있을 수 있습니다.</div>`:''}</div>

 <p class="amt" data-amt="${i}">${q>0&&p>0?'거래금액 '+fmt(q*p)+'원':''}</p></div>`;

let fileCtx=null; // {mode:'draft'|'later', id}
function readFiles(files){
 const arr=[...files].filter(f=>/^image\//.test(f.type)).slice(0,5);
 if(!arr.length){toast('이미지 파일만 첨부할 수 있습니다');return}
 Promise.all(arr.map(f=>new Promise(res=>{const fr=new FileReader();fr.onload=()=>shrink(String(fr.result)).then(res);fr.onerror=()=>res(null);fr.readAsDataURL(f)}))).then(list=>{
  list=list.filter(Boolean);
  if(fileCtx&&fileCtx.mode==='later'){const t=D.tr.find(x=>x.id===fileCtx.id);const room=5-t.ev.length;list.slice(0,room).forEach(s=>t.ev.push(s));trSheet(t.id);render(true);toast('증빙이 추가되었습니다');return}
  const d=S.draft;const room=5-d.ev.length;if(list.length>room)toast('최대 5장까지 첨부할 수 있습니다');
  list.slice(0,room).forEach(s=>d.ev.push({src:s,orig:s,rects:[],masked:false}));
  render(true);if(list.length)toast('캡쳐를 첨부했어요. 눌러서 민감정보를 가릴 수 있습니다');
 });
}
function shrink(src){return new Promise(res=>{const im=new Image();im.onload=()=>{const max=1080;const sc=Math.min(1,max/im.width);const c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.85))};im.onerror=()=>res(null);im.src=src})}
function maskEditor(i){
 const e=S.draft.ev[i];let rects=e.rects.slice();let drag=null;
 $('#layer').innerHTML=`<div class="medit" role="dialog" aria-label="캡쳐 가리기"><div class="mt"><button type="button" id="mCancel">취소</button><b>민감정보 가리기</b><button type="button" class="done" id="mDone">완료</button></div><div class="cv"><canvas id="mCv"></canvas></div><p class="mg">계좌 잔고, 다른 보유종목 등 신고와 무관한 정보를 손가락으로 드래그해 가려 주세요.<br>종목명·수량·체결일자는 보이도록 남겨 주세요.</p><div class="mb"><button type="button" id="mUndo">되돌리기</button><button type="button" id="mClear">전체 지우기</button></div></div>`;
 const cv=$('#mCv'),ctx=cv.getContext('2d'),im=new Image();
 const draw=()=>{ctx.drawImage(im,0,0,cv.width,cv.height);ctx.fillStyle='#111';rects.concat(drag?[drag]:[]).forEach(r=>{const x=Math.min(r.x1,r.x2),y=Math.min(r.y1,r.y2);ctx.fillRect(x,y,Math.abs(r.x2-r.x1),Math.abs(r.y2-r.y1))})};
 im.onload=()=>{cv.width=im.width;cv.height=im.height;draw()};im.src=e.orig;
 const pt=ev=>{const b=cv.getBoundingClientRect();return {x:(ev.clientX-b.left)*cv.width/b.width,y:(ev.clientY-b.top)*cv.height/b.height}};
 cv.addEventListener('pointerdown',ev=>{cv.setPointerCapture(ev.pointerId);const p=pt(ev);drag={x1:p.x,y1:p.y,x2:p.x,y2:p.y}});
 cv.addEventListener('pointermove',ev=>{if(!drag)return;const p=pt(ev);drag.x2=p.x;drag.y2=p.y;draw()});
 cv.addEventListener('pointerup',()=>{if(drag&&Math.abs(drag.x2-drag.x1)>6&&Math.abs(drag.y2-drag.y1)>6)rects.push(drag);drag=null;draw()});
 $('#mUndo').onclick=()=>{rects.pop();draw()};
 $('#mClear').onclick=()=>{rects=[];draw()};
 $('#mCancel').onclick=()=>{$('#layer').innerHTML=''};
 $('#mDone').onclick=()=>{draw();e.rects=rects;e.masked=rects.length>0;e.src=rects.length?cv.toDataURL('image/jpeg',.85):e.orig;$('#layer').innerHTML='';render(true);toast(rects.length?`${rects.length}개 영역을 가렸습니다`:'가린 영역이 없습니다')};
}

  d.err=err;if(err){render(true);const e=$('#tErr');e&&e.scrollIntoView({behavior:'smooth',block:'center'});toast(err);return}
  reviewSheet()},
 submit:()=>{if(!$('#cfOk').checked){toast('내용 확인에 체크해 주세요');return}
  const d=S.draft,list=[];const ev=d.ev.map(e=>e.src);
  d.rows.forEach(r=>{D.seq++;const t={id:'T'+D.seq,acct:d.acct,date:r.date,side:r.side,code:r.code,qty:+r.qty,price:r.price?+r.price:0,up:TODAY,ev:ev.slice(),st:'등록',reason:r.reason.trim()};D.tr.push(t);list.push(t)});
  post({type:'trades',rows:list.map(t=>{const a=acc(t.acct);return {code:t.code,name:SN[t.code],qty:t.qty,date:t.date,side:t.side,broker:a.broker,acct:a.no,price:t.price}})});
  D.lastAcct=d.acct;S.lastDone={n:list.length,acct:accName(acc(d.acct)),list};S.draft=null;closeSheet();S.stack=['trade'];S.scr='done';render()},
 again:()=>{newDraft();S.stack=[];S.scr='trade';render()},
 mon:d=>{const [y,m]=S.hMonth.split('-').map(Number);const dd=new Date(y,m-1+(+d.v),1);S.hMonth=dd.getFullYear()+'-'+String(dd.getMonth()+1).padStart(2,'0');render()},
 hAcct:d=>{S.hAcct=d.id;render(true)},
 noEv:()=>{S.noEv=!S.noEv;render(true)},
 trDetail:d=>trSheet(d.id),
 view:d=>{const t=D.tr.find(x=>x.id===d.id);viewer(evSrc(t,t.ev[+d.k]))},
 addEvLater:d=>{fileCtx={mode:'later',id:d.id};$('#fAlbum').value='';$('#fAlbum').click()},
 fixReq:d=>{openSheet(sh('정정 요청',`<p class="hint" style="margin-top:14px">준법감시부서 확인 후 반영되며, 변경 이력이 함께 보관됩니다.</p><div class="fld"><span class="lb req">정정 항목</span><div class="chips" style="flex-wrap:wrap" id="fxItems">${['매매일자','매매구분','종목','수량','단가','계좌','삭제(중복 등록)'].map(x=>`<button type="button" class="chip" data-act="fxTog">${x}</button>`).join('')}</div></div><div class="fld"><label class="req" for="fxR">정정 내용</label><textarea class="inp" id="fxR" rows="3" maxlength="300" placeholder="예) 수량 100주 → 10주 오입력"></textarea></div>`,`<button class="btn red" type="button" data-act="fixOk" data-id="${d.id}">정정 요청</button>`))},
 fxTog:(d,el)=>el.classList.toggle('on'),
 rqDetail:d=>rqSheet(d.id),
 rqExp:d=>rqExpSheet(d.id),
 rqExpSend:d=>{const ans={};let bad='';document.querySelectorAll('#sheet [data-q]').forEach(t=>{const v=t.value.trim();if(v.length<2)bad=bad||t.dataset.q;ans[t.dataset.q]=v});
  if(bad){toast(`'${bad}' 답변을 입력해 주세요`);return}if(!$('#qMask').checked){toast('목적 무관 정보 제외 확인에 체크해 주세요');return}
  const files={};document.querySelectorAll('#sheet [data-doc]').forEach(f=>files[f.dataset.doc]=f.files[0]?f.files[0].name:'(미첨부)');post({type:'exp',cid:d.id,ans,files})},
 rqExt:d=>openSheet(sh('소명 기한연장 요청',`<div class="fld"><label class="req" for="exD">연장 일수</label><input class="inp" id="exD" type="number" min="1" max="14" value="5"></div><div class="fld"><label class="req" for="exW">사유</label><input class="inp" id="exW" maxlength="60" placeholder="예) 증권사 자료 발급 지연"></div>`,`<div class="btn2"><button class="btn" type="button" data-act="rqDetail" data-id="${d.id}">취소</button><button class="btn red" type="button" data-act="rqExtSend" data-id="${d.id}">요청</button></div>`)),
 rqExtSend:d=>{const w=$('#exW').value.trim();if(w.length<2){toast('사유를 입력해 주세요');return}post({type:'ext',cid:d.id,d:Math.min(14,Math.max(1,+$('#exD').value||5)),why:w})},
 rqVc:d=>openSheet(sh('정보제공 '+d.v,`<p style="font-size:14px;line-height:1.6;margin:14px 0 0">${d.v==='동의'?'안내된 확인 목적·대상자료·이용기간 범위 내에서 추가 자료를 제공하는 것에 동의합니다.':'정보제공에 동의하지 않습니다. 대체절차(대면 확인 등)로 확인이 진행됩니다.'}</p>`,`<div class="btn2"><button class="btn" type="button" data-act="rqDetail" data-id="${d.id}">취소</button><button class="btn ${d.v==='동의'?'red':'line-r'}" type="button" data-act="rqVcSend" data-id="${d.id}" data-v="${d.v}">${d.v}</button></div>`)),
 rqVcSend:d=>post({type:'vc',cid:d.id,v:d.v}),
 rqWd:d=>openSheet(sh('정보제공 동의 철회',`<p style="font-size:14px;line-height:1.6;margin:14px 0 0">동의를 철회하면 제출한 추가 자료에 대한 준법감시부서의 접근이 차단됩니다.</p>`,`<div class="btn2"><button class="btn" type="button" data-act="rqDetail" data-id="${d.id}">취소</button><button class="btn line-r" type="button" data-act="rqWdSend" data-id="${d.id}">철회</button></div>`)),
 rqWdSend:d=>post({type:'wd',cid:d.id}),
 rqAdd:d=>{const r=REQ.find(x=>x.cid===d.id);openSheet(sh('추가 자료 제출',`<p class="hint" style="margin-top:12px">동의한 자료만 제출해 주세요. 목적과 무관한 정보는 제외하거나 가린 후 제출합니다.</p>${(r.vc.docs||[]).map((x,i)=>`<div class="fld"><label for="ad${i}">${esc(x)}</label><input type="file" id="ad${i}" data-doc="${esc(x)}"></div>`).join('')}<label class="cbx"><input type="checkbox" id="adMask"> <span>목적 무관 정보 제외·가림을 확인했습니다.</span></label>`,`<div class="btn2"><button class="btn" type="button" data-act="rqDetail" data-id="${d.id}">취소</button><button class="btn red" type="button" data-act="rqAddSend" data-id="${d.id}">제출</button></div>`),true)},
 rqAddSend:d=>{if(!$('#adMask').checked){toast('확인에 체크해 주세요');return}const files={};document.querySelectorAll('#sheet [data-doc]').forEach(f=>files[f.dataset.doc]=f.files[0]?f.files[0].name:'(미첨부)');post({type:'add',cid:d.id,files})},
 fixOk:d=>{const items=[...document.querySelectorAll('#fxItems .chip.on')].length;const r=$('#fxR').value.trim();if(!items){toast('정정 항목을 선택해 주세요');return}if(r.length<4){toast('정정 내용을 입력해 주세요');return}D.tr.find(x=>x.id===d.id).st='정정요청';closeSheet();render(true);toast('정정 요청이 접수되었습니다')}
};

/* =============== 이벤트 =============== */
const phone=$('#phone');
phone.addEventListener('click',e=>{
 if(e.target.id==='dim'){closeSheet();return}
 const tb=e.target.closest('[data-tab]');if(tb){closeSheet();if(tb.dataset.tab!=='hist')S.noEv=S.noEv&&false;goTab(tb.dataset.tab);return}
 const a=e.target.closest('[data-act]');if(a&&ACT[a.dataset.act]){ACT[a.dataset.act](a.dataset,a,e)}
});
phone.addEventListener('input',e=>{
 const t=e.target;
 if(t.id==='stQ'){$('#stList').innerHTML=stockItems(t.value);$('#stRecent').classList.toggle('hide',!!t.value.trim());return}
 if(t.id==='afNo'){t.value=t.value.replace(/[^\d-]/g,'')}
 if(t.dataset.f&&S.draft){const r=S.draft.rows[+t.dataset.i];const f=t.dataset.f;
  if(f==='qty'){t.value=t.value.replace(/[^\d]/g,'').slice(0,8);r.qty=t.value}
  else if(f==='price'){const v=t.value.replace(/[^\d]/g,'').slice(0,9);r.price=v;t.value=v?fmt(v):''}
  else r[f]=t.value;
  if(f==='qty'||f==='price'){const q=+r.qty,p=+r.price;const el=document.querySelector(`[data-amt="${t.dataset.i}"]`);if(el)el.textContent=q>0&&p>0?'거래금액 '+fmt(q*p)+'원':''}}
});
phone.addEventListener('change',e=>{const t=e.target;if(t.dataset.f==='date'&&S.draft){syncDraftInputs();if(t.value>TODAY)S.draft.rows[+t.dataset.i].date=TODAY;render(true)}});
$('#fAlbum').addEventListener('change',e=>e.target.files.length&&readFiles(e.target.files));
$('#fCam').addEventListener('change',e=>e.target.files.length&&readFiles(e.target.files));
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#layer').innerHTML){$('#layer').innerHTML=''}else closeSheet()}});
$('#resetBtn')?.addEventListener('click',()=>{seed();S.draft=null;S.af=null;S.noEv=false;S.hAcct='';S.hMonth=TODAY.slice(0,7);closeSheet();$('#layer').innerHTML='';goTab('home');toast('데모 데이터를 초기화했습니다')});
goTab('home');
})();
</script>
</body>
</html>
